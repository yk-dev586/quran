; إعدادات التشغيل الأساسية للتطبيق
; يمكنك تعديل هذا الملف قبل التشغيل، بينما الإعدادات الشخصية للمستخدم تحفظ في app-state.json داخل مجلد بيانات Electron.

[app]
default_language=ar
default_theme=dark
default_font=myfont.ttf
default_quran_font_size=30
default_line_height=2.1

[search]
max_quran_results=50
max_hadith_results=30

[storage]
autosave=true
